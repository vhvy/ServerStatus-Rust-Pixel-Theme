version: '3'

services:
  stat_server:
    image: idoge/stat_server:latest
    container_name: stat_server
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config.toml:/config.toml
      - ./stats.json:/stats.json
    ports:
      - '8080:8080'
      - '9394:9394'

  pixel_status:
    image: ghcr.io/vhvy/serverstatus-rust-pixel-theme:latest
    restart: unless-stopped
    depends_on:
      - stat_server
    ports:
      - '8081:80'
    environment:
      ENABLE_PING_HISTORY: 'true'
      STATS_URL: http://stat_server:8080/json/stats.json
      INTERVAL: '300'
      MAX_POINTS: '2016'
    # Optional mounts for frontend config and history persistence.
    # volumes:
    #   - ./theme-config.json:/opt/ServerStatus/web/theme-config.json:ro
    #   - ./ping-data:/usr/share/nginx/html/data
