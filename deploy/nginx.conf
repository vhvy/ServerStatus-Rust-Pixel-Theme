server {
    listen 80;
    server_name _;

    # Domain / SSL settings can be added here for your deployment.

    # Preserve the original URI when forwarding every non-static request.
    location @proxy {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $http_connection;

        # Compose service DNS; use 127.0.0.1:8080 for host-native Nginx.
        proxy_pass http://stat_server:8080;
    }

    # Serve the theme when a file exists, otherwise fall back to the backend.
    location / {
        root /opt/ServerStatus/web;
        index index.html index.htm;
        try_files $uri $uri/ @proxy;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
